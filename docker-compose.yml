version: "3.8"

services:
  db:
    image: mysql:8.0.33      # versión estable recomendada
    container_name: dairiedb
    restart: always
    environment:
      MYSQL_DATABASE: dairiedb
      MYSQL_ROOT_PASSWORD: Hernan007.
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:               # esto asegura que el contenedor se considere "saludable" solo cuando MySQL esté listo
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: dairie-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/dairiedb?useSSL=false&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: Hernan007
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: TXlTdXBlclNlY3JldEtleVRoYXRTaG91bGRCZUxvbmdFbm91Z2g=
      JWT_EXPIRATION: 3600000
    depends_on:
      db:
        condition: service_healthy   # espera a que MySQL esté listo

volumes:
  db_data:
